<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centralizando com Flexbox</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        body{
            background-color: antiquewhite;
        }
        
        main{
            background-color: lightgreen;
            width: 90vw;
            height: 90vh;
            
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }

        section{
            background-color: wheat;
            width: 200px;
            height: 200px;
            padding: 20px;
        }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Tela de login</h1>
        <p>
          Lorem ipsum dolor sit amet consectetur, adipisicing elit. Corporis,
          odio, a amet aliquam unde illum nulla fugit, dolorem repellat harum
          ullam sit atque. Voluptas sit earum ab culpa delectus eius.
        </p>
      </section>
    </main>
  </body>
</html>
