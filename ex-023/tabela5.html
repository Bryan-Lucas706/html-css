<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      caption {
        font-size: 1.5em;
        padding: 15px;
        font-weight: bold;
      }

      table {
        border-collapse: collapse;
        width: 600px;
      }

      .cnome{
        background-color: rgba(255, 255, 0, 0.544);
      }
      
      th,
      td {
        padding: 10px;
        border: 1px solid black;
      }

    </style>
  </head>
  <body>
    <h1>Exercicios de Tabela</h1>

    <table>
      <colgroup>
        <col class="cnome">
        <col class="csexo">
        <col class="cidade">
        <col class="cprof">
    </colgroup>
      <caption>
        Cadastro
      </caption>
      <tr>
        <th scope="col">Nome</th>
        <th scope="col">Sexo</th>
        <th scope="col">Idade</th>
        <th scope="col">Profissão</th>
      </tr>
      <tr>
        <td>Ana Maria</td>
        <td>Feminino</td>
        <td>25</td>
        <td>Jornalista</td>
      </tr>
      <tr>
        <td>Matheus</td>
        <td>Masculino</td>
        <td>42</td>
        <td>Programador</td>
      </tr>
      <tr>
        <td>Maria</td>
        <td>Feminino</td>
        <td>20</td>
        <td>Psicologa</td>
      </tr>
      <tr class="destaque">
        <td>Gustavo</td>
        <td>Masculino</td>
        <td>22</td>
        <td>Professor</td>
      </tr>
      <tr>
        <td>Eduarda</td>
        <td>Feminino</td>
        <td>29</td>
        <td>Advogada</td>
      </tr>
      <tr>
        <td>Otavio</td>
        <td>Masculino</td>
        <td>35</td>
        <td>Médico</td>
      </tr>
      <tr>
        <td>Lurdete</td>
        <td>Feminino</td>
        <td>53</td>
        <td>Artista</td>
      </tr>
    </table>
  </body>
</html>
