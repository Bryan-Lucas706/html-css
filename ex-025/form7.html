<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criando tabelas</title>
  </head>
  <body>
    <h1>Exemplo de Formulario</h1>
    <form action="cadastro.php" method="get">
      <p>
        <label for="iest">Estado: </label>
        <select name="est" id="iest">
          <option value="" selected>--- Escolha ---</option>
          <option value="pr">Pananá</option>

          <optgroup label="Região Sudeste">
            <option value="mg">Minas Gerais</option>
            <option value="rj">Rio de Janeiro</option>
            <option value="sp">São Paulo</option>
          </optgroup>

          <optgroup label="Região Nordeste">
            <option value="ma">Maranhão</option>
            <option value="pe">Pernanbuco</option>
            <option value="rn">Rio Grande do Norte</option>
          </optgroup>
        </select>
      </p>

      <p>
        <label for="imsg">Mensagem: </label>
        <textarea name="msg" id="imsg" cols="30" rows="10" placeholder="Digite sua mensagem aqui..."></textarea>
      </p>

      <p>
        <label for="iprof">Profissão: </label>
        <input type="text" name="prof" id="iprof" list="lista" />
        <datalist id="lista">
          <option value="ADM">Administrador</option>
          <option value="CONT">Contabilista</option>
          <option value="DEV">Desenvolvedor</option>
          <option value="PROF">Professor</option>
        </datalist>
      </p>

      <p>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
      </p>
    </form>
  </body>
</html>
